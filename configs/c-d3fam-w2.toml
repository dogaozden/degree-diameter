# Wave 2 twin of c-d3fam, seeded with its top 5 programs as of origin/claude/c-d3fam-evolve-run-9hgvbl.
# C-engine specialist cloud island: only d11D3, d13D3, d15D3 (+ d3D3 smoke). One cloud session, 4 vCPU.
# Starts from the C starter program (g000-seed) plus the best Python program for its target(s).
run_id = "c-d3fam-w2"
problem = "problems.bipartite_dd.islands_c:D3FAM"
seed = 1306
generations = 80
candidates_per_generation = 32
eval_seeds = [0]
time_limit_s = 60
workers = 4
seed_programs = [
  "seeds/wave2/c-d3fam/g006-c01.py",
  "seeds/wave2/c-d3fam/g005-c21.py",
  "seeds/wave2/c-d3fam/g005-c10.py",
  "seeds/wave2/c-d3fam/g005-c08.py",
  "seeds/wave2/c-d3fam/g005-c05.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 600
max_calls = 3000
stop_at = 0.9

[selection]
elite_k = 6
roles = { default = 0.35, crossover = 0.2, invent = 0.25, moonshot = 0.2 }

[git]
enabled = true
push = true
