# Wave 2 twin of spec-d5d5, seeded with its top 5 programs as of origin/spec-d5d5.
# Specialist cloud island: only d5D5 (+ d3D3 smoke). One cloud session, 4 vCPU.
run_id = "spec-d5d5-w2"
problem = "problems.bipartite_dd.islands:D5D5"
seed = 1201
generations = 80
candidates_per_generation = 32
eval_seeds = [0]
time_limit_s = 60
workers = 4
seed_programs = [
  "seeds/wave2/spec-d5d5/g012-c31.py",
  "seeds/wave2/spec-d5d5/g012-c07.py",
  "seeds/wave2/spec-d5d5/g012-c03.py",
  "seeds/wave2/spec-d5d5/g011-c28.py",
  "seeds/wave2/spec-d5d5/g011-c25.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 300
max_calls = 3000
stop_at = 0.9

[selection]
elite_k = 6
roles = { default = 0.35, crossover = 0.2, invent = 0.25, moonshot = 0.2 }

[git]
enabled = true
push = true
