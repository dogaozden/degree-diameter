# Wave 2 twin of island-1, seeded with its top 5 programs as of origin/island-1.
# Cloud island 1: one Claude Code cloud session (4 vCPU, 16 GB). Seeded from run-002's best programs.
run_id = "island-1-w2"
problem = "problems.bipartite_dd.problem_v2"
seed = 1101
generations = 60
candidates_per_generation = 16
eval_seeds = [0]
time_limit_s = 30
workers = 4
seed_programs = [
  "seeds/wave2/island-1/g004-c12.py",
  "seeds/wave2/island-1/g005-c02.py",
  "seeds/wave2/island-1/g004-c06.py",
  "seeds/wave2/island-1/g004-c03.py",
  "seeds/wave2/island-1/g003-c05.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 300
max_calls = 1000
stop_at = 0.9

[selection]
elite_k = 4
roles = { default = 0.4, crossover = 0.2, invent = 0.2, moonshot = 0.2 }

[git]
enabled = true
push = true
