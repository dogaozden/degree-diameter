# Wave w3 island, seeded with the top 5 programs of spec-d4d5 (origin/spec-d4d5).
# Specialist cloud island: only d4D5 (+ d3D3 smoke). One cloud session, 4 vCPU.
run_id = "spec-d4d5-w3"
problem = "problems.bipartite_dd.islands:D4D5"
seed = 2200
generations = 80
candidates_per_generation = 32
eval_seeds = [0]
time_limit_s = 60
workers = 4
seed_programs = [
  "seeds/w3/spec-d4d5-w3/spec-d4d5-g016-c08.py",
  "seeds/w3/spec-d4d5-w3/spec-d4d5-g016-c02.py",
  "seeds/w3/spec-d4d5-w3/spec-d4d5-g015-c27.py",
  "seeds/w3/spec-d4d5-w3/spec-d4d5-g015-c26.py",
  "seeds/w3/spec-d4d5-w3/spec-d4d5-g015-c25.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 300
max_calls = 3000
stop_at = 0.9

[selection]
elite_k = 6
roles = { default = 0.35, crossover = 0.2, invent = 0.25, moonshot = 0.2 }

[git]
enabled = true
push = true
