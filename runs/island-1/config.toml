# Cloud island 1: one Claude Code cloud session (4 vCPU, 16 GB). Seeded from run-002's best programs.
run_id = "island-1"
problem = "problems.bipartite_dd.problem_v2"
seed = 101
generations = 60
candidates_per_generation = 16
eval_seeds = [0]
time_limit_s = 30
workers = 4
seed_programs = [
  "runs/run-002/candidates/g016-c08/program.py",
  "runs/run-002/candidates/g014-c07/program.py",
  "runs/run-002/candidates/g015-c00/program.py",
  "runs/run-002/candidates/g014-c04/program.py",
  "runs/run-002/candidates/g006-c02/program.py",
  "runs/run-002/candidates/g018-c00/program.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 300
max_calls = 1000
stop_at = 0.9

[selection]
elite_k = 4
roles = { default = 0.4, crossover = 0.2, invent = 0.2, moonshot = 0.2 }

[git]
enabled = true
push = true
