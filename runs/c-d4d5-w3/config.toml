# Wave w3 island, seeded with the top 5 programs of c-d4d5 (origin/c-d4d5).
# C-engine specialist cloud island: only d4D5 (+ d3D3 smoke). One cloud session, 4 vCPU.
# Starts from the C starter program (g000-seed) plus the best Python program for its target(s).
run_id = "c-d4d5-w3"
problem = "problems.bipartite_dd.islands_c:D4D5"
seed = 2300
generations = 80
candidates_per_generation = 32
eval_seeds = [0]
time_limit_s = 60
workers = 4
seed_programs = [
  "seeds/w3/c-d4d5-w3/c-d4d5-g019-c31.py",
  "seeds/w3/c-d4d5-w3/c-d4d5-g019-c30.py",
  "seeds/w3/c-d4d5-w3/c-d4d5-g019-c27.py",
  "seeds/w3/c-d4d5-w3/c-d4d5-g019-c26.py",
  "seeds/w3/c-d4d5-w3/c-d4d5-g019-c24.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 600
max_calls = 3000
stop_at = 0.9

[selection]
elite_k = 6
roles = { default = 0.35, crossover = 0.2, invent = 0.25, moonshot = 0.2 }

[git]
enabled = true
push = true
