# Wave 2 twin of spec-d4d5, seeded with its top 5 programs as of origin/spec-d4d5.
# Specialist cloud island: only d4D5 (+ d3D3 smoke). One cloud session, 4 vCPU.
run_id = "spec-d4d5-w2"
problem = "problems.bipartite_dd.islands:D4D5"
seed = 1200
generations = 80
candidates_per_generation = 32
eval_seeds = [0]
time_limit_s = 60
workers = 4
seed_programs = [
  "seeds/wave2/spec-d4d5/g010-c18.py",
  "seeds/wave2/spec-d4d5/g010-c08.py",
  "seeds/wave2/spec-d4d5/g010-c06.py",
  "seeds/wave2/spec-d4d5/g010-c01.py",
  "seeds/wave2/spec-d4d5/g010-c00.py",
]

[mutator]
kind = "claude"
model = "claude-haiku-5-5"
concurrency = 8
timeout_s = 300
max_calls = 3000
stop_at = 0.9

[selection]
elite_k = 6
roles = { default = 0.35, crossover = 0.2, invent = 0.25, moonshot = 0.2 }

[git]
enabled = true
push = true
